name: lint

# Thin caller for the reusable shell/actionlint gate authored in dotfiles-core
# (.github/workflows/lint-call.yml) — one definition for the whole fleet, replacing the
# ~200-line copy this file used to carry. The gate's internals (the SHA-256-verified
# pinned-tool bootstrap, the core/ exclude, shfmt-advisory) live there now. This repo has no
# extra excludes (only Offense does), so no `with:` is needed.
# DELIBERATELY UNFILTERED. This used to carry `paths-ignore: ["**.md", "LICENSE"]`,
# which was the efficient choice but made the two `lint /` checks impossible to
# REQUIRE in the main ruleset: a required check that never reports blocks the merge
# forever, so a docs-only PR would deadlock. (Live example: commit c4a00c6 changed
# only README.md and triggered none of the filtered workflows — correctly.)
#
# The job is cheap — no containers, ~1-2 minutes, and the pinned gate tools are
# cached — so running it on a typo costs little next to the deadlock it removes.
# bootstrap.yml and packages.yml KEEP their filters on purpose: both pull an
# archlinux:latest container, and neither is a required check.
on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    uses: dotgibson/dotfiles-core/.github/workflows/lint-call.yml@v4
