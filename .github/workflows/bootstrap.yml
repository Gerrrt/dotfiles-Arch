# .github/workflows/bootstrap.yml
# Thin caller for the reusable bootstrap test authored in dotfiles-core. The logic
# lives there (one place for the whole fleet); this just names Arch's container +
# the deps bootstrap needs. See dotfiles-core/.github/workflows/bootstrap-test.yml.
name: bootstrap

on:
  pull_request:
    paths: ['bootstrap.sh', 'core/**', 'os/**', 'ssh/**', 'install/**', '.github/workflows/bootstrap.yml']
  push:
    branches: [main]
    paths: ['bootstrap.sh', 'core/**', 'os/**', 'ssh/**', 'install/**', '.github/workflows/bootstrap.yml']
  workflow_dispatch:
  # For packages-check ONLY, and it is the reason that job is worth having. A package
  # rename or drop upstream breaks this repo's list with NOBODY having edited the repo,
  # so a gate that fires only on pull_request cannot see the failure it exists to catch —
  # it would go red on the next unrelated PR, blaming a change that did not cause it.
  # Core's bootstrap-test.yml recommends pairing packages_check with a schedule for this.
  schedule:
    - cron: "17 6 * * 2"

permissions:
  contents: read

jobs:
  test:
    uses: dotgibson/dotfiles-core/.github/workflows/bootstrap-test.yml@v4
    with:
      image: archlinux:latest
      # Full sync+upgrade, not -Sy: a partial upgrade can pull a zsh newer than the
      # base image's libs. --needed skips already-present bash.
      prep: "pacman -Syu --noconfirm --needed bash zsh"
      # Run provision() for real, with package managers and downloaders replaced by
      # logging no-ops (dotgibson/dotfiles-core#575). --links-only returns BEFORE
      # provision() is entered, so package installation, retries, upstream installers,
      # repo/key setup and every failure path around them were executed by no gate
      # anywhere. A green run means provision() ran and RETURNED, and wire_links still
      # happened after it — not that provisioning works: nothing is really installed.
      provision_stub: true
      # Resolve every name in the package list against the real repos, downloading
      # nothing. This is the blind spot provision_stub cannot cover: it stubs the
      # package managers, so a WRONG PACKAGE NAME is invisible to it.
      # `pacman -Sp`, NOT `pacman -Si` — this runs the same TARGET RESOLUTION `pacman -S`
      # performs, and that distinction is the whole correctness of the gate. bootstrap.sh
      # installs these names with `pacman -S`, which resolves `provides`, so the probe has
      # to ask the same question. `-Si` matches package NAMES only: it rejects `sh`, which
      # is not a package on Arch but a `provides` of bash, even though `pacman -S sh` works
      # fine. Nothing in the current list sits behind a `provides`, so `-Si` passes today —
      # it would have gone red on an unrelated PR the day upstream restructured a package.
      # --noconfirm picks a default when a capability has several providers, instead of
      # blocking on a prompt no one can answer in CI.
      # Verified in CI both directions: `bash` and `sh` resolve, a bogus name is REJECTED.
      # No prep change needed — prep already runs `pacman -Syu`, and the -Sy half populates
      # the sync database these lookups read.
      packages_check: pacman -Sp --noconfirm
      # packages_file is left at its default (install/packages.txt) — this repo's list
      # needs no pre-filtering, unlike dotfiles-Debian's per-distro annotations.
